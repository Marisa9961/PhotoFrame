[package]
name = "photo-frame"
version = "1.0.0"
edition = "2024"
description = "Rust + GPUI 原生照片印框工具"
authors = ["Marisa9961"]
license = "MIT"

[dependencies]
gpui = "=0.2.2"
anyhow = "1.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp"] }
cosmic-text = "0.14.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust-i18n = "=4.2.4"
unicode-segmentation = "1.12"
libjpeg-turbo-rs = "=0.8.0"

[build-dependencies]
embed-resource = "=3.0.12"

[profile.release]
lto = "thin"
strip = true


