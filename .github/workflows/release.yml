name: Build and draft release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-draft-release
  cancel-in-progress: false

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read version and validate tag
        id: version
        shell: python
        run: |
          import os
          import pathlib
          import subprocess
          import tomllib

          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text(encoding='utf-8'))['package']['version']
          tag = f'v{version}'
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != tag:
              raise SystemExit(f'Tag does not match Cargo version {tag}')
          existing_tag = subprocess.check_output(['git', 'tag', '--list', tag], text=True).strip()
          if existing_tag:
              tag_commit = subprocess.check_output(['git', 'rev-parse', f'{tag}^{{commit}}'], text=True).strip()
              if tag_commit != os.environ['GITHUB_SHA']:
                  raise SystemExit(f'Existing tag {tag} points to a different commit')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\ntag={tag}\n')

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x64
            toolchain: stable-x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            platform: linux-x64
            toolchain: stable-x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      APP_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config cmake clang libclang-dev \
            libfontconfig-dev libfreetype6-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libvulkan-dev

      - name: Set up Rust
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }

      - name: Locate Windows shader compiler
        if: runner.os == 'Windows'
        run: |
          $fxc = $env:GPUI_FXC_PATH
          if (-not $fxc -or -not (Test-Path -LiteralPath $fxc -PathType Leaf)) {
            $fxc = (Get-Command fxc.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $fxc) {
            $kitRoot = Get-ItemPropertyValue -Path 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots' -Name KitsRoot10 -ErrorAction SilentlyContinue
            $roots = @($env:WindowsSdkDir, $kitRoot, "${env:ProgramFiles(x86)}\Windows Kits\10") |
              Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -Unique
            foreach ($root in $roots) {
              $versions = Get-ChildItem -LiteralPath (Join-Path $root 'bin') -Directory -Force -ErrorAction SilentlyContinue |
                Where-Object Name -Match '^\d+\.\d+\.\d+\.\d+$' |
                Sort-Object { [version]$_.Name } -Descending
              foreach ($sdk in $versions) {
                $candidate = Join-Path $sdk.FullName 'x64\fxc.exe'
                if (Test-Path -LiteralPath $candidate -PathType Leaf) {
                  $fxc = $candidate
                  break
                }
              }
              if ($fxc) { break }
            }
          }
          if (-not $fxc) { throw 'Windows SDK fxc.exe was not found' }
          "GPUI_FXC_PATH=$fxc" >> $env:GITHUB_ENV
          Write-Host "Using FXC: $fxc"

      - name: Check and test
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting check failed' }
          cargo clippy --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }

      - name: Build release
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }

      - name: Package ZIP
        if: runner.os == 'Windows'
        run: |
          $name = "PhotoFrame-$env:APP_VERSION-windows-x64"
          $package = Join-Path $env:GITHUB_WORKSPACE "target\package\$name"
          New-Item -ItemType Directory -Path "$package\licenses" -Force | Out-Null
          Copy-Item -LiteralPath 'target\release\photo-frame.exe' -Destination $package
          Copy-Item -LiteralPath 'LICENSE', 'THIRD_PARTY_NOTICES.md' -Destination $package
          Copy-Item -Path 'licenses\*' -Destination "$package\licenses"
          @(
            "印框 · PhotoFrame $env:APP_VERSION - Windows x64"
            ''
            'Extract the ZIP and run photo-frame.exe.'
            'Requires the Microsoft Visual C++ x64 Runtime.'
            'Runtime installer: https://aka.ms/vc14/vc_redist.x64.exe'
          ) | Set-Content -LiteralPath "$package\README.txt" -Encoding utf8
          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          $zip = Join-Path $env:GITHUB_WORKSPACE "dist\$name.zip"
          Compress-Archive -Path "$package\*" -DestinationPath $zip -Force

      - name: Package TAR.GZ
        if: runner.os == 'Linux'
        shell: bash
        run: |
          name="PhotoFrame-$APP_VERSION-linux-x64"
          mkdir -p "target/package/$name" dist
          cp target/release/photo-frame LICENSE THIRD_PARTY_NOTICES.md "target/package/$name/"
          cp -r licenses "target/package/$name/"
          tar -C target/package -czf "dist/$name.tar.gz" "$name"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: photo-frame-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Upload both platforms to draft release
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: photo-frame-*
          path: dist
          merge-multiple: true

      - name: Upload packages to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:RELEASE_TAG
          $assets = @(
            (Join-Path $env:GITHUB_WORKSPACE "dist/PhotoFrame-$env:APP_VERSION-windows-x64.zip")
            (Join-Path $env:GITHUB_WORKSPACE "dist/PhotoFrame-$env:APP_VERSION-linux-x64.tar.gz")
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release package: $asset" }
          }
          $pagesJson = gh api --paginate --slurp "repos/$repo/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to query releases' }
          $pages = $pagesJson | ConvertFrom-Json -NoEnumerate
          $existing = $null
          foreach ($page in $pages) {
            foreach ($release in $page) {
              if ($release.tag_name -eq $tag) { $existing = $release }
            }
          }
          if ($existing) {
            if (-not $existing.draft) { throw "Release $tag is already published" }
            gh release edit $tag --repo $repo --draft --target $env:GITHUB_SHA --title "印框 · PhotoFrame $env:APP_VERSION"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to update draft target' }
            gh release upload $tag @assets --repo $repo --clobber
          } else {
            $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            "印框 · PhotoFrame $env:APP_VERSION for Windows x64 and Linux x64.`n`nWindows: extract the ZIP and run photo-frame.exe. Requires the [Microsoft Visual C++ x64 Runtime](https://aka.ms/vc14/vc_redist.x64.exe).`n`nLinux: extract the TAR.GZ and run photo-frame. Desktop runtime compatibility has not been verified." |
              Set-Content -LiteralPath $notes -Encoding utf8
            gh release create $tag @assets --repo $repo --draft --target $env:GITHUB_SHA --title "印框 · PhotoFrame $env:APP_VERSION" --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed' }
